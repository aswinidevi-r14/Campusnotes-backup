<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | CampusNotes</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/style.css') }}">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            📚 Campus<span>Notes</span>
        </div>

        <h1>Welcome back 👋</h1>

        <p class="auth-subtitle">
            Sign in to continue learning.
        </p>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit" class="auth-button">
                Login →
            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="/register">
                Create account
            </a>

        </p>

    </div>

</div>

</body>
</html>
